name: spicehut_admin_panel
description: Admin Panel for Spice Hut Restaurant
publish_to: 'none'
version: 3.4.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  fl_chart: ^1.2.0
  just_audio: ^0.9.36
  shared_preferences: ^2.5.5
  http: ^1.1.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  socket_io_client: ^2.0.3+1
  url_launcher: ^6.2.6
  pdf: ^3.13.1
  printing: ^5.15.1
  permission_handler: ^13.0.2
  flutter_esc_pos_utils: ^1.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/spicehut_logo.png
    - assets/sounds/ringtone.mp3

flutter_launcher_icons:
  image_path: "assets/logo/spicehut_logo.png"
  android:
    notification_icon: "ic_launcher"
  ios: true
  remove_alpha_ios: true
